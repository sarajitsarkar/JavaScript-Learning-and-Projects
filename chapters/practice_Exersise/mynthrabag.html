<!DOCTYPE html>
<html lang="en">
<head>
  <title>Myntra Bag</title>
  <link rel="stylesheet" href="mynthrabag.css">
</head>
<body>
  <main>
    <button class="bag-button" onclick="cartQuantity ++; document.querySelector('#cart-summary').innerText =`your bag has items ${cartQuantity} items`;">Add to bag</button>

   <button class="wish-button" onclick=
    "cartQuantity --; document.querySelector('#cart-summary').innerText =`your bag has items ${cartQuantity} items`;"> move to wishlist </button>

   <button class="bag-button" onclick=" cartQuantity += 2; document.querySelector('#cart-summary').innerText =`your bag has items ${cartQuantity} items`;">Add 1+1  sale iteam</button>
   

   <h1 id="cart-summary">Your Bag has 0 items</h1>

   <script>
    let cartQuantity = 0;
    document.querySelector('#cart-summary').innerText =`your bag has items ${cartQuantity} items`;
   </script>






  </main>
  
</body>
</html>
